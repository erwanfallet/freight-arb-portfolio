[project]
name = "freight"
version = "0.3.0"
description = "Physical commodity arbitrage — twelve projects across dry bulk, refined products, softs and grains"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    # scipy : brentq (les points de bascule) et l'IC exact de Clopper-Pearson.
    # statsmodels : ADF, KPSS et la covariance HAC Newey-West.
    # Dans le moteur et pas dans l'extra "app" : les golden tests du socle en dependent.
    # Reecrire un KPSS a la main est le genre de chose qui produit une page fausse sans
    # jamais planter.
    "scipy>=1.10",
    "statsmodels>=0.14",
    # openpyxl : lecture de l'export Bloomberg (.xlsx). Sans lui, la moitie des projets
    # tombe en collecte de tests avec un ModuleNotFoundError peu parlant.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# le dashboard : separe du moteur, pour que les tests tournent sans streamlit
app = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
